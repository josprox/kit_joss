name: kit_joss
description: "Librería central, reutilizable y estándar para los proyectos del ecosistema Joss."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.0.0 <2.0.0"
  flutter_secure_storage: ">=9.0.0 <11.0.0"
  package_info_plus: ">=9.0.0 <11.0.0"
  url_launcher: ">=6.2.0 <7.0.0"
  crypto: ^3.0.7
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
